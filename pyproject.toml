[project]
name = "bookingservice"
version = "0.1.0"
description = "Service for booking rooms in hotel"
authors = [
    {name = "Ivan",email = "killallxxx3@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "pydantic (>=2.14.4,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
